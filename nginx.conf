events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Enable Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost sevenseed.in *.sevenseed.in;

        # Static Venture Marketing Sites
        root /usr/share/nginx/html;
        index index.html;

        # Hub Homepage
        location / {
            try_files $uri $uri/ /sevenseed/index.html;
        }

        # Sub-venture Marketing Sites
        location /comonk/ {
            try_files $uri $uri/ /comonk/index.html;
        }
        location /sevenforce/ {
            try_files $uri $uri/ /sevenforce/index.html;
        }
        location /avpu/ {
            try_files $uri $uri/ /avpu/index.html;
        }
        location /decode-forest-pharmacy/ {
            try_files $uri $uri/ /decode-forest-pharmacy/index.html;
        }
        location /breakdown-factor/ {
            try_files $uri $uri/ /breakdown-factor/index.html;
        }
        location /rakshak-ai/ {
            try_files $uri $uri/ /rakshak-ai/index.html;
        }
        location /avp-charitable-trust/ {
            try_files $uri $uri/ /avp-charitable-trust/index.html;
        }
        location /avp-emart/ {
            try_files $uri $uri/ /avp-emart/index.html;
        }

        # Reverse Proxy to FastAPI Hub (Backend Services & APIs)
        location /api/ {
            proxy_pass http://sevenseed-hub:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy to Child Apps
        location /api/v1/ {
            proxy_pass http://sevenseed-hub:8000/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
