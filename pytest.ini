[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --no-header -q --ignore=tests/static_site
norecursedirs = static_site node_modules .git
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

