services:
  # Python FastAPI Backend API Service
  - type: web
    name: sevenseed-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.comonk.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Next.js 14 React Frontend Web App
  - type: web
    name: sevenseed-web
    runtime: node
    rootDir: apps/sevenseed-web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://sevenseed-api.onrender.com
